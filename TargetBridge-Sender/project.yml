name: TargetBridge
options:
  bundleIdPrefix: com.targetbridge
  deploymentTarget:
    macOS: "14.0"

targets:
  TBDisplaySender:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: TBDisplaySender
        excludes:
          - "**/*.md"
      - path: TBDisplayShared
        excludes:
          - "**/*.md"
      - path: ../TargetBridge-Shared
        excludes:
          - "**/*.md"
          - "scripts/**"
      - path: TargetBridgeSupport/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: "TargetBridge"
        PRODUCT_BUNDLE_IDENTIFIER: com.targetbridge.sender
        # CFBundleDisplayName / NSHumanReadableCopyright / NSScreenCaptureUsageDescription now
        # live in TargetBridgeSupport/Info.plist (Xcode drops INFOPLIST_KEY_* usage strings once
        # INFOPLIST_FILE is set; the file is the single source of truth for those + the URL scheme).
        MARKETING_VERSION: "3.6.0"
        CURRENT_PROJECT_VERSION: "20261012120715"
        SWIFT_VERSION: "6.0"
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_STRICT_CONCURRENCY: minimal
        SWIFT_OBJC_BRIDGING_HEADER: TargetBridgeSupport/TargetBridge-Bridging-Header.h
        GENERATE_INFOPLIST_FILE: YES
        # Base plist merged with the auto-generated keys; declares the targetbridge:// URL scheme.
        INFOPLIST_FILE: TargetBridgeSupport/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # PWE: pairing and encrypted sessions. TargetBridge-Shared/secure is C on
        # libsodium, built universal by pwe/receiver-deps.sh (pwe/package.sh passes
        # PWE_SODIUM_DIR; the default is that script's cache).
        PWE_SODIUM_DIR: "$(HOME)/Library/Caches/pwe-screen-encore-deps/universal"
        HEADER_SEARCH_PATHS: ["$(PWE_SODIUM_DIR)/include", "$(SRCROOT)/../TargetBridge-Shared/secure"]
        OTHER_LDFLAGS: ["$(PWE_SODIUM_DIR)/lib/libsodium.a", "-framework", "Security"]
    preBuildScripts:
      - name: Stamp Sender Build Info
        script: |
          set -euo pipefail
          STAMP="${TB_SENDER_BUILD:-$(date +%Y%m%d%H%M%S)}"
          cat > "${SRCROOT}/TBDisplaySender/TBDisplaySenderBuildInfo.swift" <<EOI
          enum TBDisplaySenderBuildInfo {
              static let marketingVersion = "3.6.0"
              static let buildNumber = "${STAMP}"
              static let versionDisplay = "\\(marketingVersion) + build \\(buildNumber)"
          }
          EOI

  TBDisplaySenderTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: TBDisplaySenderTests
    dependencies:
      - target: TBDisplaySender
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.targetbridge.sender.tests
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TargetBridge.app/Contents/MacOS/TargetBridge"
        BUNDLE_LOADER: "$(TEST_HOST)"
        # PWE: tests call the shared C layer directly (test vectors).
        SWIFT_OBJC_BRIDGING_HEADER: TargetBridgeSupport/TargetBridge-Bridging-Header.h
        PWE_SODIUM_DIR: "$(HOME)/Library/Caches/pwe-screen-encore-deps/universal"
        HEADER_SEARCH_PATHS: ["$(PWE_SODIUM_DIR)/include", "$(SRCROOT)/../TargetBridge-Shared/secure"]

schemes:
  TBDisplaySender:
    build:
      targets:
        TBDisplaySender: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - TBDisplaySenderTests
